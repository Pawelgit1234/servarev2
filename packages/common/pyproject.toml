[project]
name = "common"
version = "0.1.0"
description = "Common functionality for other packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
]

[project.scripts]
common = "common:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
