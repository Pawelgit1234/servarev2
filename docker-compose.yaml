services:
  scanner:
    build:
      context: .
      dockerfile: packages/scanner/Dockerfile
    container_name: scanner
    restart: no
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - MASSCAN_RATE=${MASSCAN_RATE}
    depends_on:
      - redis
      - migrator
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  
  checker:
    build:
      context: .
      dockerfile: packages/checker/Dockerfile
    container_name: checker
    restart: no
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - CHECK_CONCURRENCY=${CHECK_CONCURRENCY}
      - SERVER_CHECK_TIMEOUT=${SERVER_CHECK_TIMEOUT}
      - S3_ROOT_USER=${MINIO_ROOT_USER}
      - S3_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      - db
      - redis
      - scanner
      - migrator
  
  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
  
  tester:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db_test
      - DB_PORT=5433
    profiles:
      - manual
    depends_on:
      - db_test
  
  db_test:
    image: postgres:18.3-alpine
    container_name: postgres-db-test
    restart: no
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    profiles:
      - manual
    ports:
      - 5433:5432
  
  db:
    image: postgres:18.3-alpine
    container_name: postgres-db
    restart: no
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    restart: no
    ports:
      - 6379:6379
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: no
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    

volumes:
  pgdata:
  minio_data: