[project]
name = "servarev2"
version = "0.1.0"
description = "Minecraft server scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/common",
    "packages/checker",
    "packages/monitor",
    "packages/porter",
    "packages/scanner",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "types-redis>=4.6.0.20241004",
    "sqlalchemy>=2.0.49",
]
migrations = [
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.11",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

# ---------- Ruff ----------

[tool.ruff]
line-length = 79
target-version = "py312"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["E902"]
exclude = ["alembic/*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- Mypy ----------

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true