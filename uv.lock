version = 1
revision = 2
requires-python = ">=3.12"

[manifest]
members = [
    "common",
    "scanner",
    "servarev2",
]

[[package]]
name = "common"
version = "0.1.0"
source = { editable = "packages/common" }

[[package]]
name = "scanner"
version = "0.1.0"
source = { editable = "packages/scanner" }
dependencies = [
    { name = "common" },
]

[package.metadata]
requires-dist = [{ name = "common", editable = "packages/common" }]

[[package]]
name = "servarev2"
version = "0.1.0"
source = { virtual = "." }
